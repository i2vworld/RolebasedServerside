<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employment Status Updated</title>
</head>
<body style="font-family: Arial, sans-serif;">
<div style="max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background-color: #e0e7ff; border-left: 4px solid #4f46e5; padding: 15px; margin-bottom: 20px;">
        <h2 style="color: #4f46e5; margin: 0;">📋 Employment Status Updated</h2>
    </div>
    <p>Dear <span th:text="${name}">User</span>,</p>
    <p>Your employment status has been updated.</p>
    <p><strong>Old Status:</strong> <span th:text="${oldStatus}"></span></p>
    <p><strong>New Status:</strong> <span th:text="${newStatus}"></span></p>
    <p><strong>Reason:</strong> <span th:text="${reason}"></span></p>
    <p><strong>Date:</strong> <span th:text="${date}"></span></p>
    <p>If you have any questions, please contact HR.</p>
    <hr style="margin: 20px 0;">
    <p style="font-size: 12px; color: #666;">&copy; <span th:text="${year}">2024</span> I2V Auth System</p>
</div>
</body>
</html>
