<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Account Deactivated</title>
</head>
<body style="font-family: Arial, sans-serif;">
<div style="max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background-color: #fee2e2; border-left: 4px solid #dc2626; padding: 15px; margin-bottom: 20px;">
        <h2 style="color: #dc2626; margin: 0;">⚠️ Account Deactivated</h2>
    </div>
    <p>Dear <span th:text="${name}">User</span>,</p>
    <p>Your account has been <strong style="color: #dc2626;">DEACTIVATED</strong>.</p>
    <p><strong>Reason:</strong> <span th:text="${reason}">Reason</span></p>
    <p><strong>Date:</strong> <span th:text="${date}">Date</span></p>
    <p>You can no longer access the system. Please contact HR for more information.</p>
    <hr style="margin: 20px 0;">
    <p style="font-size: 12px; color: #666;">&copy; <span th:text="${year}">2024</span> I2V Auth System</p>
</div>
</body>
</html>
