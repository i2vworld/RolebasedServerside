<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Attendance Alert</title>
</head>
<body style="font-family: Arial, sans-serif;">
<div style="max-width: 600px; margin: 0 auto; padding: 20px;">
  <div style="background-color: #fef3c7; border-left: 4px solid #f59e0b; padding: 15px; margin-bottom: 20px;">
    <h2 style="color: #d97706; margin: 0;">⏰ Attendance Alert</h2>
  </div>
  <p>Dear <span th:text="${name}">User</span>,</p>
  <p><strong>Alert Type:</strong> <span th:text="${alertType}"></span></p>
  <p><strong>Message:</strong> <span th:text="${message}"></span></p>
  <hr style="margin: 20px 0;">
  <p style="font-size: 12px; color: #666;">&copy; <span th:text="${year}">2024</span> I2V Auth System</p>
</div>
</body>
</html>
