spring.application.name=i2vAuthAPI

# SQL Server Database Configuration - USE ENVIRONMENT VARIABLES
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:i2v_db};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:Node_user}
spring.datasource.password=${DB_PASSWORD:Node@12345}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Configuration - Hibernate validates only, no schema changes
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.default-schema=dbo

# Cache configuration - expire entries so stale settings/permissions self-heal
# (companySettings/userPermissions/holidays) without manual cache clearing
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=15m

# Rate Limiting
# Auth endpoints stay strict; general API endpoints allow normal SPA startup bursts.
security.rate-limit.auth.requests=${RATE_LIMIT_AUTH_REQUESTS:5}
security.rate-limit.auth.window-ms=${RATE_LIMIT_AUTH_WINDOW_MS:60000}
security.rate-limit.general.requests=${RATE_LIMIT_GENERAL_REQUESTS:300}
security.rate-limit.general.window-ms=${RATE_LIMIT_GENERAL_WINDOW_MS:60000}

# Mail Configuration - USE ENVIRONMENT VARIABLES
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:i2v.consulting.helpdesk@gmail.com}
spring.mail.password=${MAIL_PASSWORD:vqjqsblgpxinmyoh}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Server
server.port=${SERVER_PORT:8080}

# JWT Configuration - USE ENVIRONMENT VARIABLES
# Generate a strong secret with: openssl rand -base64 64
# For development, using a temporary default. CHANGE FOR PRODUCTION!
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLWRlZmF1bHQtand0LXNlY3JldC1mb3ItZGV2ZWxvcG1lbnQtb25seS1jaGFuZ2UtZm9yLXByb2R1Y3Rpb24tZW52aXJvbm1lbnQtdmFyaWFibGU=}
jwt.expiration=${JWT_EXPIRATION:604800000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:86400000}

# App Configuration
app.base-url=${APP_BASE_URL:http://localhost:3000}
app.mail.from=${MAIL_FROM:i2v.consulting.helpdesk@gmail.com}

# CORS - Configure allowed origins via environment variable
# Format: http://localhost:3000,http://localhost:3001,https://yourdomain.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:4000}

# Logging
logging.level.com.world.i2v=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=INFO
